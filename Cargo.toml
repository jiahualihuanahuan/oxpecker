[package]
name = "oxpecker"
version = "1.0.0"
edition = "2021"
description = "Find and optionally terminate high-memory, low-CPU background processes you own on macOS"
license = "MIT"
readme = "README.md"
keywords = ["macos", "memory", "process", "cli"]
categories = ["command-line-utilities"]

[dependencies]
sysinfo = "0.40"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
dialoguer = "0.11"
